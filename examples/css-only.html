<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CSS-only example</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Inter:wght@400;500&display=swap" rel="stylesheet">
<style>
  /* No canvas, no animation: cssBackdrop() just returns a CSS `background` value.
     Use it for small cards, email and OG images, or as the first-paint fallback under a shader. */
  :root { --bg: #F6F3EE; --panel: #fff; --ink: #1C1A17; --muted: #6E6A63; --line: #E4DFD6; }
  @media (prefers-color-scheme: dark) { :root { --bg: #141312; --panel: #1E1C1A; --ink: #F2EEE8; --muted: #A39E95; --line: #2E2B28; } }
  * { box-sizing: border-box; }
  body { margin: 0; padding: 40px 24px 64px; background: var(--bg); color: var(--ink); font: 14px/1.45 Inter, system-ui, sans-serif; }
  header, main { max-width: 1100px; margin: 0 auto; }
  h1 { font: 400 40px/1 'Instrument Serif', serif; margin: 0 0 8px; }
  header p { margin: 0 0 28px; color: var(--muted); max-width: 60ch; }
  main { display: grid; gap: 20px; grid-template-columns: repeat(auto-fill, minmax(min(100%, 320px), 1fr)); }
  .card { background: var(--panel); border-radius: 16px; overflow: hidden; box-shadow: 0 1px 0 var(--line), 0 8px 24px rgba(0,0,0,.05); }
  .art { position: relative; aspect-ratio: 3 / 2; display: grid; place-items: center; font: italic 400 34px 'Instrument Serif', serif; }
  .art .grain { position: absolute; inset: 0; background-size: 256px; pointer-events: none; }
  .art span { position: relative; }
  .meta { padding: 14px; display: grid; gap: 8px; }
  .meta b { font-weight: 500; }
  .meta small { color: var(--muted); }
  pre { margin: 0; padding: 10px; border-radius: 10px; background: var(--bg); font-size: 11px; white-space: pre-wrap; word-break: break-word; max-height: 120px; overflow: auto; }
  button { justify-self: start; border: 1px solid var(--line); background: var(--bg); color: var(--ink); font: inherit; padding: 6px 12px; border-radius: 999px; cursor: pointer; }
</style>
</head>
<body>
  <header>
    <h1>CSS-only backdrops</h1>
    <p>Five static looks generated by <code>cssBackdrop(kind, colors)</code>. Colours are interpolated in OKLab, with a plain fallback for older browsers. Click copy to grab the CSS.</p>
  </header>
  <main id="grid"></main>

  <script src="../assets/backdrop.js"></script>
  <script>
    const { cssBackdrop, grainURL, CSS_PRESETS } = GradientBackdrop;
    const INK = { 'slow-days': '#853B51', rosa: '#67364F', atelier: '#713221', 'soft-signal': '#342F61', halo: '#4A3A66' };
    const grid = document.getElementById('grid');

    for (const [name, p] of Object.entries(CSS_PRESETS)) {
      const css = `background: ${cssBackdrop(p.kind, p.colors)};`;
      const card = document.createElement('article');
      card.className = 'card';
      card.innerHTML = `
        <div class="art" style="${css.replace(/"/g, '&quot;')}; color:${INK[name]}">
          ${p.grain ? `<div class="grain" style="background-image:url(${grainURL()});opacity:${p.grain}"></div>` : ''}
          <span>${name.replace(/-/g, ' ')}</span>
        </div>
        <div class="meta">
          <div><b>${name}</b> <small>· ${p.kind}${p.grain ? ' + grain' : ''}</small></div>
          <pre></pre>
          <button>Copy CSS</button>
        </div>`;
      card.querySelector('pre').textContent = css;
      card.querySelector('button').onclick = (e) => {
        navigator.clipboard?.writeText(css);
        e.target.textContent = 'Copied ✓';
        setTimeout(() => (e.target.textContent = 'Copy CSS'), 1400);
      };
      grid.appendChild(card);
    }
  </script>
</body>
</html>
